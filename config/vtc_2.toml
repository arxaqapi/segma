[logging]
offline = false
project = "segma_v2"
name = "train_VTC-2.1"

[data]
dataset_path = "/store/scratch/tkunze/data/_derivations/baby_train_u20"
labels = ["KCHI", "OCH", "MAL", "FEM"]

[audio]
chunk_duration_s = 4
sample_rate = 16_000
strict_frames = true

[model]
model_id = "hubert_large" # or "W2V4300LL", comment for hubert_base and BabyHuBERT
#model_checkpoint = "/store/scratch/tcharlot/models/wav2vec2_ll4300_torchaudio.pt"
[train]
learning_rate = 1.0e-05
batch_size = 128
max_epochs = 3
dataload_num_workers = 24
scheduler_patience = 3
