[project]
name = "segma"
version = "0.1.0"
description = "Minimal audio segmentation toolkit."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "interlap>=0.2.7",
    "lightning>=2.4.0",
    "matplotlib>=3.9.2",
    "numpy>=2.1.2",
    "polars>=1.22.0",
    "scikit-learn>=1.8.0",
    "scipy>=1.14.1",
    "tomlkit>=0.14.0",
    "torch>=2.9.1",
    "torchaudio>=2.9.1",
    "torchcodec>=0.9.0",
    "transformers>=4.47.1",
    "wandb>=0.18.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.3.3",
    "ruff>=0.15",
]

[tool.ruff.lint]
ignore = ["E722"]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore:.*sentry_sdk\\.Hub.*:DeprecationWarning",
]
